version: '3.8'

services:
  db:
    image: postgres:15
    container_name: ecommerce-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ecommerce
    ports:
      - "5433:5432"
    volumes:
      # persist data even if container stops
      - postgres_data:/var/lib/postgresql/data
      # run migrations automatically on first start
      - ./migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: ecommerce-app
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_HOST: db        # not localhost — the service name "db" is the hostname
      DB_PORT: 5432      # internal port, not 5433
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: ecommerce
      JWT_SECRET: ${JWT_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    depends_on:
      db:
        condition: service_healthy  # wait for postgres to be ready before starting app
    restart: on-failure

volumes:
  postgres_data: